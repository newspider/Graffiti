<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
// ============================================================
//  GRAFFITI PAINTER — with selectable spray heads
// ============================================================

let tool = 'spray';          // 'brush' | 'spray' | 'eraser'
let brushSize = 34;
let colorPicker;
let drips = [];

// ---- Spray head presets ------------------------------------
// density  : particles emitted per frame (measured at brushSize 30)
// spread   : spray cone radius, as a multiplier of brushSize
// softness : >1 = tight core w/ soft edges, <1 = flat, even disc
// size     : [min, max] particle diameter
// alpha    : per‑particle opacity (low = slow build‑up, realistic)
// drips    : chance per frame of starting a paint run
const SPRAY_HEADS = {
  mist:     { label: 'Mist / fine', density: 70, spread: 1.15, softness: 1.70, size: [1.0,  2.4], alpha: 12, drips: 0.000 },
  standard: { label: 'Standard',    density: 40, spread: 1.00, softness: 1.05, size: [1.5,  3.5], alpha: 20, drips: 0.000 },
  fat:      { label: 'Fat cap',     density: 24, spread: 1.25, softness: 0.75, size: [3.0,  8.0], alpha: 42, drips: 0.015 },
  splatter: { label: 'Splatter',    density:  9, spread: 1.90, softness: 0.50, size: [3.0, 13.0], alpha: 85, drips: 0.050 },
  drippy:   { label: 'Drippy',      density: 34, spread: 0.85, softness: 1.30, size: [2.0,  5.0], alpha: 28, drips: 0.050 }
};
const HEAD_KEYS = Object.keys(SPRAY_HEADS);
let currentHead = 'standard';

// ---- HUD geometry ------------------------------------------
const HUD = { x: 16, y: 16, w: 216, h: 212 };
const HEAD_ROW_H = 20;
const HEAD_TOP = HUD.y + 84;

// ============================================================
function setup() {
  createCanvas(windowWidth, windowHeight);
  background(225);

  colorPicker = createColorPicker('#e63946');
  colorPicker.position(HUD.x + 12, HUD.y + 34);
  colorPicker.size(104, 26);

  textFont('monospace');
  textSize(11);
}

function draw() {
  updateDrips();

  // Paint every frame while the button is held — this lets the
  // spray keep building up even when the mouse isn't moving.
  if (mouseIsPressed && !overHUD()) applyTool();

  drawHUD();
}

// ============================================================
//  TOOLS
// ============================================================
function applyTool() {
  const c = colorPicker.color();

  if (tool === 'spray') {
    sprayPaint(c);
  } else if (tool === 'eraser') {
    erase();
    strokeWeight(brushSize);
    stroke(0);
    strokeCap(ROUND);
    line(pmouseX, pmouseY, mouseX, mouseY);
    noErase();
  } else {
    stroke(c);
    strokeWeight(brushSize);
    strokeCap(ROUND);
    noFill();
    if (mouseX === pmouseX && mouseY === pmouseY) point(mouseX, mouseY);
    else line(pmouseX, pmouseY, mouseX, mouseY);
  }
}

// ============================================================
//  SPRAY PAINTING
// ============================================================
function sprayPaint(c) {
  const h = SPRAY_HEADS[currentHead];
  const scale = brushSize / 30;
  const count = min(h.density * scale, 420);
  const spread = brushSize * h.spread;
  const r = red(c), g = green(c), b = blue(c);

  noStroke();

  // --- main cone of particles ---
  for (let i = 0; i < count; i++) {
    const a = random(TWO_PI);
    // pow() < 1 flattens the disc, > 1 concentrates it at the centre
    const rad = spread * pow(random(), h.softness);
    const x = mouseX + cos(a) * rad;
    const y = mouseY + sin(a) * rad;
    const s = random(h.size[0], h.size[1]) * pow(scale, 0.5);

    fill(r, g, b, h.alpha);
    ellipse(x, y, s, s);
  }

  // --- stray overspray specks outside the cone ---
  const strays = count * 0.08;
  for (let i = 0; i < strays; i++) {
    const a = random(TWO_PI);
    const rad = spread * random(1, 1.9);
    fill(r, g, b, h.alpha * 0.6);
    const s = random(0.8, 2.6);
    ellipse(mouseX + cos(a) * rad, mouseY + sin(a) * rad, s, s);
  }

  // --- occasional paint drips ---
  if (random() < h.drips) spawnDrip(r, g, b);
}

// ============================================================
//  DRIPS — the tip is drawn each frame, leaving a streak behind
// ============================================================
function spawnDrip(r, g, b) {
  drips.push({
    x: mouseX + random(-brushSize * 0.5, brushSize * 0.5),
    y: mouseY + random(0, brushSize * 0.35),
    w: random(2, 5) * (brushSize / 30),
    speed: random(0.35, 1.1),
    life: random(40, 120),
    col: color(r, g, b)
  });
}

function updateDrips() {
  for (let i = drips.length - 1; i >= 0; i--) {
    const d = drips[i];

    d.speed *= 1.03;   // gravity
    d.y += d.speed;
    d.w *= 0.99;       // thins out as it runs

    noStroke();
    fill(red(d.col), green(d.col), blue(d.col), 190);
    ellipse(d.x, d.y, d.w, d.w * 1.5);

    d.life--;
    if (d.life <= 0 || d.w < 0.8) drips.splice(i, 1);
  }
}

// ============================================================
//  HUD
// ============================================================
function drawHUD() {
  push();
  noStroke();

  fill(18, 18, 22, 205);
  rect(HUD.x, HUD.y, HUD.w, HUD.h, 10);

  textAlign(LEFT, TOP);

  fill(255);
  text('TOOL: ' + tool.toUpperCase(), HUD.x + 12, HUD.y + 12);

  fill(130);
  text('SPRAY HEADS  (1‑5)', HUD.x + 12, HEAD_TOP - 16);

  HEAD_KEYS.forEach((k, i) => {
    const rowY = HEAD_TOP + i * HEAD_ROW_H;
    const active = (k === currentHead);
    const h = SPRAY_HEADS[k];

    if (active) {
      fill(255, 255, 255, 28);
      noStroke();
      rect(HUD.x + 8, rowY - 2, HUD.w - 16, HEAD_ROW_H - 2, 4);
    }

    fill(active ? 255 : 165);
    text((i + 1) + '  ' + h.label, HUD.x + 14, rowY);

    // particle‑size preview swatch
    fill(active ? 255 : 140);
    circle(HUD.x + HUD.w - 22, rowY + 5, constrain(h.size[1], 3, 13));
  });

  // size readout
  fill(130);
  text('SIZE ' + round(brushSize) + '   ( + / - )', HUD.x + 12, HUD.y + 188);

  pop();
}

function overHUD() {
  return mouseX >= HUD.x && mouseX <= HUD.x + HUD.w &&
         mouseY >= HUD.y && mouseY <= HUD.y + HUD.h;
}

// ============================================================
//  INPUT
// ============================================================
function mousePressed() {
  if (!overHUD()) return;

  // click a row in the HUD to pick a spray head
  HEAD_KEYS.forEach((k, i) => {
    const rowY = HEAD_TOP + i * HEAD_ROW_H;
    if (mouseX > HUD.x + 8 && mouseX < HUD.x + HUD.w - 8 &&
        mouseY > rowY - 2 && mouseY < rowY + HEAD_ROW_H - 4) {
      currentHead = k;
      tool = 'spray';
    }
  });
}

function keyPressed() {
  if (key === 'b' || key === 'B') tool = 'brush';
  if (key === 's' || key === 'S') tool = 'spray';
  if (key === 'e' || key === 'E') tool = 'eraser';

  if (key === '=' || key === '+') brushSize = constrain(brushSize * 1.12, 2, 180);
  if (key === '-')                brushSize = constrain(brushSize * 0.89, 2, 180);

  if (key === 'c' || key === 'C') { background(225); drips = []; }
  if (key === 'p' || key === 'P') saveCanvas('graffiti', 'png');

  // number keys pick a spray head
  const n = parseInt(key);
  if (n >= 1 && n <= HEAD_KEYS.length) {
    currentHead = HEAD_KEYS[n - 1];
    tool = 'spray';
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background(225); // note: this clears the artwork
}
</script>
</body>
</html>
