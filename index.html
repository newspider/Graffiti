<div id="ui">
  <div class="row">
    <span class="lbl">COLOR</span>
    <button data-tool="spray" class="active">Spray</button>
    <button data-tool="eraser">Eraser</button>
    <button data-tool="orbit">Orbit</button>
  </div>

  <!-- On-page swatch palette -->
  <div id="palette"></div>

  <div class="row">
    <span class="lbl">MIX</span>
    <input type="range" id="r" min="0" max="255" value="230">
    <input type="range" id="g" min="0" max="255" value="57">
    <input type="range" id="b" min="0" max="255" value="70">
    <div id="preview"></div>
  </div>

  <div class="row" id="heads"><span class="lbl">HEAD</span></div>
  <div class="row">
    <span class="lbl">SIZE</span>
    <input type="range" id="size" min="6" max="90" value="30">
  </div>
  <div class="row" id="shapes"><span class="lbl">SHAPE</span></div>
  <div class="row">
    <button id="spin" class="active">Auto‑spin</button>
    <button id="clear">Clear</button>
    <button id="save">Save PNG</button>
  </div>
  <div class="lbl">Drag on object = paint · Drag on background = orbit · Scroll = zoom</div>
</div>
